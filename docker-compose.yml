# Local development. The everyday workflow is:
#
#   docker compose up -d db     # PostgreSQL only
#   pnpm dev                    # the app, natively (faster than running Next in Docker on a Mac)
#
# `--profile full` also builds and runs the production image, to check container behavior:
#
#   BETTER_AUTH_SECRET=$(openssl rand -base64 32) docker compose --profile full up --build
#
# Production uses docker-compose.prod.yml (added with feature 06).
# The full profile also runs the background worker (feature 08).

name: dayboard

services:
  db:
    # pgvector is needed for searching by meaning (V2 feature 10, docs/decisions/0011).
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: dayboard
      POSTGRES_PASSWORD: dayboard
      POSTGRES_DB: dayboard
    # Bound to localhost only. Set DB_PORT if 5432 is already taken on your machine.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - dayboard-db-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dayboard -d dayboard"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    profiles: ["full"]
    build:
      context: .
      args:
        APP_VERSION: local
    command: ["node", "migrate.mjs"]
    environment:
      DATABASE_URL: postgres://dayboard:dayboard@db:5432/dayboard
      MIGRATIONS_FOLDER: ./drizzle/migrations
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    profiles: ["full"]
    build:
      context: .
      args:
        APP_VERSION: local
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://dayboard:dayboard@db:5432/dayboard
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET (openssl rand -base64 32)}
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # A production build refuses to start without a mail provider. E2E=true swaps in the console
      # sender, which writes each email to /tmp/emails.jsonl: docker compose exec web cat /tmp/emails.jsonl
      E2E: "true"
      E2E_EMAIL_FILE: /tmp/emails.jsonl
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Background jobs (V2 feature 08): the same image, a different command. Runs beside `web` in the full profile.
  # Without Docker: `pnpm worker` runs it natively next to `pnpm dev`.
  worker:
    profiles: ["full"]
    build:
      context: .
      args:
        APP_VERSION: local
    command: ["node", "worker.mjs"]
    environment:
      DATABASE_URL: postgres://dayboard:dayboard@db:5432/dayboard
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET (openssl rand -base64 32)}
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      E2E: "true"
    # The image's health check calls the web server, which this container does not run.
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Longer than the worker's 30 second drain, so a stop finishes running jobs instead of killing them.
    stop_grace_period: 40s

  # Real-time collaboration (V3 feature 05, docs/decisions/0019): the same image, a WebSocket service on port 1234.
  # Without Docker: `pnpm collab` runs it natively next to `pnpm dev` (with COLLAB_URL, COLLAB_TOKEN_SECRET and
  # COLLAB_INTERNAL_SECRET in .env.local, and SHARING_ENABLED=true). To use it in the full profile, set the same three
  # COLLAB_* values on `web` too, with COLLAB_URL=ws://localhost:1234 and COLLAB_INTERNAL_URL=http://collab:1234.
  collab:
    profiles: ["full"]
    build:
      context: .
      args:
        APP_VERSION: local
    command: ["node", "collab.mjs"]
    ports:
      - "127.0.0.1:1234:1234"
    environment:
      DATABASE_URL: postgres://dayboard:dayboard@db:5432/dayboard
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET (openssl rand -base64 32)}
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SHARING_ENABLED: "true"
      COLLAB_URL: ws://localhost:1234
      COLLAB_PORT: "1234"
      COLLAB_TOKEN_SECRET: ${COLLAB_TOKEN_SECRET:-dev-only-collab-token-secret-0123456789abcdef}
      COLLAB_INTERNAL_SECRET: ${COLLAB_INTERNAL_SECRET:-dev-only-collab-internal-secret-0123456789ab}
      E2E: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1234/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  dayboard-db-dev:
